{% extends "base.html" %}
{% block title %}{{ heading }} | LibManage{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="panel p-4 p-md-5">
<h1 class="fw-bold mb-4">{{ heading }}</h1><form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary" type="submit">Save Student</button> <a class="btn btn-outline-secondary" href="{% url 'students' %}">Cancel</a>
</form></div></div></div>
{% endblock %}
